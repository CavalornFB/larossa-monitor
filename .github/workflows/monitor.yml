name: Larossa Reservations Sniper

on:
  schedule:
    # Esegue ogni 10 minuti con jitter casuale (intervallo effettivo variabile tra 5 e 15 minuti)
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-reservations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Random Jitter Delay (0-5 min)
        run: |
          # Randomizza l'orario effettivo di scansione per variare l'intervallo tra 5 e 15 minuti
          DELAY=$(( RANDOM % 300 ))
          echo "Attesa casuale di $DELAY secondi prima della scansione..."
          sleep $DELAY

      - name: Run Larossa Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Commit and push changes to seen_slots.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_slots.json
          if ! git diff --staged --quiet; then
            git commit -m "Update seen slots [skip ci]"
            git push
          else
            echo "Nessuna modifica a seen_slots.json da committare."
          fi
